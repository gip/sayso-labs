name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-and-check-skills:
    name: Build, test, and check skills
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sayso-labs
        uses: actions/checkout@v4
        with:
          path: sayso-labs

      - name: Checkout canonical sayso
        uses: actions/checkout@v4
        with:
          repository: gip/sayso
          ref: main
          path: sayso

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sayso-labs/pnpm-lock.yaml

      - name: Check SKILL.md parity
        run: |
          set -euo pipefail

          for skill in sayso-protocol sayso-payment sayso-upgrade sayso-network sayso-claim sayso-runtime sayso-configure sayso-fork sayso-source; do
            diff -u "sayso/${skill}/SKILL.md" "sayso-labs/skills/${skill}/SKILL.md"
          done

      - name: Install dependencies
        run: pnpm --dir sayso-labs install --frozen-lockfile

      - name: Build
        run: pnpm --dir sayso-labs build

      - name: Validate examples
        run: pnpm --dir sayso-labs validate:examples

      - name: Test
        run: pnpm --dir sayso-labs test

      - name: Typecheck
        run: pnpm --dir sayso-labs typecheck
